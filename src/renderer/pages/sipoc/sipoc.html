<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIPOC Estruturado</title>
    <style>
      body {
        margin: 0;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
          background: #f3f6f8;
        color: #2d3347;
        min-height: 100vh;
          padding: 24px;
      }
      .container {
        max-width: 1440px;
        margin: 0 auto;
        background: #ffffff;
          border-radius: 10px;
          padding: 28px;
          box-shadow: 0 8px 22px rgba(23, 62, 104, 0.06);
      }
      h1 {
        margin-top: 0;
          font-size: clamp(2rem, 3vw, 2.8rem);
          color: #173e68;
      }
      p {
        line-height: 1.8;
        color: #4f5d72;
          margin-bottom: 20px;
      }
      .top-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-bottom: 24px;
      }
      .button,
      .button-secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 14px 22px;
          border-radius: 5px;
        border: none;
        text-decoration: none;
        cursor: pointer;
        font-weight: 700;
      }
      .button {
        background: #d13f3f;
        color: #ffffff;
      }
      .button:hover {
        background: #ab3030;
      }
      .button-secondary {
        background: #f8fafc;
        color: #1f2937;
        border: 1px solid rgba(45, 51, 71, 0.12);
      }
      .sipoc-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 16px;
      }
      .sipoc-table th,
      .sipoc-table td {
        border: 1px solid rgba(45, 51, 71, 0.12);
        padding: 14px 12px;
        text-align: left;
        vertical-align: top;
      }
      .sipoc-table th {
        background: #f8fafc;
        color: #1f2937;
        font-size: 0.95rem;
        font-weight: 700;
      }
      .sipoc-table tbody tr:nth-child(even) {
        background: #f9fbff;
      }
      .sipoc-table a {
        color: #d13f3f;
        font-weight: 700;
        text-decoration: none;
      }
      .sipoc-table a:hover {
        text-decoration: underline;
      }
      .empty-state {
        background: #eff6ff;
        border: 1px dashed #93c5fd;
          border-radius: 6px;
        padding: 28px;
        text-align: center;
        color: #1d4ed8;
      }
      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 28px;
        color: #d13f3f;
        text-decoration: none;
        font-weight: 700;
      }
      @media (max-width: 760px) {
        .top-actions {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Histórico - SIPOCs</h1>
      <p>
        Veja todos os SIPOCs já registrados e crie um novo formulário de SIPOC
        sempre que precisar.
      </p>
      <div class="top-actions">
        <a class="button" href="create-sipoc.html">+ Novo SIPOC</a>
        <button class="button-secondary" type="button" onclick="clearSipocs()">
          Limpar lista
        </button>
      </div>
      <div id="sipocContainer">
        <table id="sipocTable" class="sipoc-table">
          <thead>
            <tr>
              <th>Processo</th>
              <th>Data de emissão</th>
              <th>Hora</th>
              <th>Elaborador</th>
              <th>Data revisão</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="sipocBody"></tbody>
        </table>
      </div>
      <div id="emptyState" class="empty-state" style="display: none">
        <strong>Nenhum SIPOC cadastrado ainda.</strong>
        <p>Use o botão "Novo SIPOC" para criar um novo registro.</p>
      </div>
      <a class="back-link" href="../inicio/home_page.html"
        >← Voltar para Home</a
      >
    </div>
    <script>
      const STORAGE_KEY = 'sipoc_entries';
      const sipocBody = document.getElementById('sipocBody');
      const emptyState = document.getElementById('emptyState');
      const sipocTable = document.getElementById('sipocTable');

      function loadSipocs() {
        const list = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        sipocBody.innerHTML = '';

        if (!list.length) {
          sipocTable.style.display = 'none';
          emptyState.style.display = 'block';
          return;
        }

        sipocTable.style.display = 'table';
        emptyState.style.display = 'none';

        list.forEach((sipoc) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${sipoc.processoArea || 'Não informado'}</td>
            <td>${sipoc.emissaoData || sipoc.createdAt.split(' ')[0] || '–'}</td>
            <td>${sipoc.emissaoHora || sipoc.createdAt.split(' ')[1] || '–'}</td>
            <td>${sipoc.elaborador || '–'}</td>
            <td>${sipoc.revisaoData || '–'}</td>
            <td><a href="create-sipoc.html?id=${sipoc.id}">Abrir</a></td>
          `;
          sipocBody.appendChild(row);
        });
      }

      function clearSipocs() {
        if (!confirm('Limpar todos os SIPOCs cadastrados?')) {
          return;
        }
        localStorage.removeItem(STORAGE_KEY);
        loadSipocs();
      }

      loadSipocs();
    </script>
  </body>
</html>
