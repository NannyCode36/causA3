<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Plano de ação - causA3</title><style>
:root{font-family:'Segoe UI',sans-serif;color:#172b4d;background:#f3f6f8}*{box-sizing:border-box}body{margin:0;padding:30px;background:radial-gradient(circle at 10% 0%,#fff 0,transparent 36%),#f3f6f8}.page{max-width:1180px;margin:auto}.back{color:#8f1d23;text-decoration:none;font-weight:700}header{margin:22px 0}h1{margin:0;color:#173e68;font-size:clamp(2rem,4vw,3rem)}.subtitle{color:#64748b}.panel{background:#fff;border:1px solid #d7dee7;border-radius:10px;padding:22px;box-shadow:0 8px 22px rgba(23,62,104,.06);margin-bottom:18px}.details{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.detail{border-left:3px solid #b5232a;padding-left:12px}.detail strong{display:block;color:#64748b;font-size:.76rem;text-transform:uppercase}.detail span{display:block;margin-top:5px}.description{line-height:1.6;color:#526276}.action-form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:12px;align-items:end}label{display:grid;gap:7px;font-weight:700;font-size:.86rem}input,select{border:1px solid #cbd5e1;border-radius:5px;padding:11px;font:inherit}button{background:#b5232a;color:#fff;border:0;border-radius:5px;padding:11px 16px;font-weight:700;cursor:pointer}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid #e5eaf0}th{font-size:.76rem;text-transform:uppercase;color:#526276;background:#f8fafc}.status{border-radius:4px;padding:5px 8px;background:#fff1d6;color:#945d00;font-size:.78rem;font-weight:700}.status.done{background:#e6f4ed;color:#176b45}.error{color:#a51f27;font-weight:700}@media(max-width:800px){body{padding:20px}.details{grid-template-columns:1fr 1fr}.action-form{grid-template-columns:1fr}}@media(max-width:450px){.details{grid-template-columns:1fr}}
</style></head><body><main class="page"><a class="back" href="ocorrencias.html">← Voltar para ocorrências</a><header><h1 id="title">Plano de ação</h1><p class="subtitle">Tratamento, responsáveis e acompanhamento da eficácia da ocorrência.</p></header><p id="message" class="error"></p><section class="panel"><div class="details" id="details"></div><p class="description" id="description"></p></section><section class="panel"><h2>Adicionar ação</h2><form class="action-form" id="action-form"><label>Ação<input name="acao" required placeholder="Descreva a ação corretiva" /></label><label>Responsável<input name="responsavel" /></label><label>Prazo<input name="prazo" type="date" /></label><label>Status<select name="status"><option>pendente</option><option>em_andamento</option><option>concluida</option></select></label><button>Adicionar</button></form></section><section class="panel"><h2>Plano de ação registrado</h2><div class="table-wrap"><table><thead><tr><th>Ação</th><th>Responsável</th><th>Prazo</th><th>Status</th><th>Atualizar</th></tr></thead><tbody id="actions"></tbody></table></div></section></main><script>
const API='http://localhost:3000/api/ocorrencias';const id=new URLSearchParams(location.search).get('id');const message=document.getElementById('message');let occurrence;const esc=value=>String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));function show(){document.getElementById('title').textContent=`Plano de ação • ${occurrence.numero}`;document.getElementById('details').innerHTML=[['Cliente',occurrence.cliente],['Contrato',occurrence.contrato],['Localidade',[occurrence.cidade,occurrence.estado].filter(Boolean).join(' / ')],['Prioridade',occurrence.prioridade],['Status',occurrence.status],['Responsável',occurrence.responsavel]].map(item=>`<div class="detail"><strong>${item[0]}</strong><span>${esc(item[1])||'Não informado'}</span></div>`).join('');document.getElementById('description').textContent=occurrence.descricao;document.getElementById('actions').innerHTML=(occurrence.planoAcao||[]).map(action=>`<tr><td>${esc(action.acao)}</td><td>${esc(action.responsavel)||'A definir'}</td><td>${action.prazo?new Date(action.prazo).toLocaleDateString('pt-BR'):'Não definido'}</td><td><span class="status ${action.status==='concluida'?'done':''}">${esc(action.status)}</span></td><td><button type="button" onclick="updateAction('${action._id}')">Concluir</button></td></tr>`).join('')||'<tr><td colspan="5">Nenhuma ação registrada.</td></tr>'}async function load(){try{const response=await fetch(`${API}/${id}`);if(!response.ok)throw new Error('Ocorrência não encontrada.');occurrence=await response.json();show()}catch(error){message.textContent=error.message}}document.getElementById('action-form').addEventListener('submit',async event=>{event.preventDefault();const data=Object.fromEntries(new FormData(event.target));occurrence.planoAcao.push(data);await save();event.target.reset()});async function save(){const response=await fetch(`${API}/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({planoAcao:occurrence.planoAcao})});if(!response.ok){message.textContent='Não foi possível atualizar o plano.';return}occurrence=await response.json();show()}async function updateAction(actionId){const action=occurrence.planoAcao.find(item=>item._id===actionId);if(action){action.status='concluida';await save()}}load();
</script></body></html>
