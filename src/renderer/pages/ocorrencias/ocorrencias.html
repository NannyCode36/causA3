<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Ocorrências de Clientes - causA3</title>
  <style>
    :root{font-family:'Segoe UI',sans-serif;color:#172b4d;background:#f3f6f8}*{box-sizing:border-box}body{margin:0;padding:30px;background:radial-gradient(circle at 10% 0%,#fff 0,transparent 36%),#f3f6f8}.page{max-width:1320px;margin:auto}.back{color:#8f1d23;text-decoration:none;font-weight:700}header{display:flex;justify-content:space-between;align-items:end;gap:18px;margin:22px 0}h1{margin:0;color:#173e68;font-size:clamp(2rem,4vw,3rem)}.subtitle{margin:8px 0 0;color:#64748b}.panel{background:#fff;border:1px solid #d7dee7;border-radius:10px;padding:22px;box-shadow:0 8px 22px rgba(23,62,104,.06);margin-bottom:18px}.panel-title{margin:0 0 18px;color:#173e68;font-size:1.05rem}.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}label{display:grid;gap:7px;font-weight:700;font-size:.86rem}input,select{width:100%;border:1px solid #cbd5e1;border-radius:5px;padding:11px;font:inherit;background:#fff}.span-2{grid-column:span 2}button{align-self:end;background:#b5232a;color:#fff;border:0;border-radius:5px;padding:11px 16px;font-weight:700;cursor:pointer}button:hover{background:#8f1d23}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.toolbar input{max-width:390px}.count{color:#64748b;font-size:.9rem}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:1080px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #e5eaf0;vertical-align:top}th{color:#526276;font-size:.76rem;text-transform:uppercase;letter-spacing:.04em;background:#f8fafc}td{color:#334155}tbody tr{cursor:pointer}tbody tr:hover{background:#fff7f7}td a{color:#8f1d23;font-weight:800;text-decoration:none}.status{display:inline-block;border-radius:4px;padding:5px 8px;font-size:.76rem;font-weight:700;background:#e6f4ed;color:#176b45}.status.alert{background:#fbe4e5;color:#a51f27}.empty{text-align:center;color:#64748b;padding:30px}#message{margin:0 0 16px;color:#a51f27;font-weight:700}@media(max-width:820px){body{padding:20px}header,.toolbar{display:block}.form-grid{grid-template-columns:1fr}.span-2{grid-column:auto}.toolbar input{max-width:none;margin-top:12px}}
  </style>
</head>
<body><main class="page"><a class="back" href="../inicio/home_page.html">← Voltar para início</a><header><div><h1>Tratativas de Ocorrências</h1><p class="subtitle">Cadastro, histórico e plano de ação das ocorrências de clientes.</p></div></header><p id="message" role="alert"></p>
  <section class="panel"><h2 class="panel-title">Dados iniciais do cliente e ocorrência</h2><form id="occurrence-form"><div class="form-grid">
    <label>Nome do cliente<input name="cliente" required placeholder="Razão social ou nome" /></label><label>Número do contrato<input name="contrato" placeholder="Ex.: CT-2026-0042" /></label><label>Contato<input name="contato" placeholder="Nome e telefone" /></label><label>E-mail<input name="email" type="email" placeholder="cliente@empresa.com" /></label><label class="span-2">Endereço<input name="endereco" placeholder="Rua, número e complemento" /></label><label>Cidade<input name="cidade" placeholder="Cidade" /></label><label>Estado<input name="estado" maxlength="2" placeholder="UF" /></label><label class="span-2">Descrição da ocorrência<input name="descricao" required placeholder="Descreva o problema reportado" /></label><label>Área<select name="area"><option>Logística</option><option>Revisão</option><option>Expedição</option><option>Recebimento</option><option>Outro</option></select></label><label>Prioridade<select name="prioridade"><option>Baixa</option><option selected>Média</option><option>Alta</option><option>Crítica</option></select></label><label>Responsável<input name="responsavel" placeholder="Responsável pelo tratamento" /></label><button type="submit">Cadastrar ocorrência</button>
  </div></form></section><section class="panel"><div class="toolbar"><strong>Histórico de ocorrências</strong><input id="search" placeholder="Contrato, cliente, número, cidade ou descrição" /><span class="count" id="count"></span></div><div class="table-wrap"><table><thead><tr><th>Número</th><th>Data</th><th>Cliente</th><th>Contrato</th><th>Localidade</th><th>Ocorrência</th><th>Área</th><th>Prioridade</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
  <script>
    const API='http://localhost:3000/api/ocorrencias';const form=document.getElementById('occurrence-form');const rows=document.getElementById('rows');const search=document.getElementById('search');const count=document.getElementById('count');const message=document.getElementById('message');let records=[];const esc=value=>String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    function render(){const term=search.value.toLowerCase();const visible=records.filter(item=>Object.values(item).join(' ').toLowerCase().includes(term));count.textContent=`${visible.length} registro(s)`;rows.innerHTML=visible.length?visible.map(item=>`<tr><td><a href="ocorrencia.html?id=${item._id}">${esc(item.numero)}</a></td><td>${new Date(item.createdAt).toLocaleDateString('pt-BR')}</td><td>${esc(item.cliente)}</td><td>${esc(item.contrato)||'Não informado'}</td><td>${esc([item.cidade,item.estado].filter(Boolean).join(' / '))||'Não informado'}</td><td>${esc(item.descricao)}</td><td>${esc(item.area)}</td><td>${esc(item.prioridade)}</td><td><span class="status ${['Alta','Crítica'].includes(item.prioridade)?'alert':''}">${esc(item.status)}</span></td></tr>`).join(''):'<tr><td colspan="9" class="empty">Nenhuma ocorrência encontrada.</td></tr>'}
    async function load(){try{const response=await fetch(`${API}?q=${encodeURIComponent(search.value)}`);if(!response.ok)throw new Error('Banco de dados indisponível.');records=await response.json();message.textContent='';render()}catch(error){message.textContent=`${error.message} Inicie o backend para consultar o histórico.`;records=[];render()}}
    form.addEventListener('submit',async event=>{event.preventDefault();try{const response=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});if(!response.ok)throw new Error('Não foi possível salvar a ocorrência.');form.reset();await load()}catch(error){message.textContent=error.message}});search.addEventListener('input',load);load();
  </script></body></html>
